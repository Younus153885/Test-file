name: Build & Release Debug APK

on:
  push:
    branches:
      - main
      - master
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses & Install SDK 36.1
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"

          SDKMGR=""
          for P in "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" $(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager 2>/dev/null) $(which sdkmanager 2>/dev/null); do
            if [ -x "$P" ]; then
              SDKMGR="$P"
              break
            fi
          done

          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" --sdk_root="$ANDROID_SDK_ROOT" --install "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true
          fi

      - name: Prepare Keystore, Firebase Config, Libraries, and Environment File
        env:
          KEYSTORE_B64: ""
          XPOSED_B64: ""
          GOOGLE_SERVICES_B64: ""
          FIREBASE_CONFIG_B64: "PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiIHN0YW5kYWxvbmU9Im5vIj8+CjxyZXNvdXJjZXM+CiAgICA8c3RyaW5nIG5hbWU9ImZpcmVzdG9yZV9kYXRhYmFzZV9pZCIgdHJhbnNsYXRhYmxlPSJmYWxzZSI+YWktc3R1ZGlvLWFuZHJvaWQtZ2hvc3RkZXYtNzEzZDgwMDAtYTVjYi00ZjE5LWI0ZDYtYjFjN2MwMGI2NTk1PC9zdHJpbmc+CjwvcmVzb3VyY2VzPg=="
        run: |
          # 1. Ensure debug.keystore exists (AI Studio GitHub sync excludes debug.keystore & debug.keystore.base64)
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -s debug.keystore ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > debug.keystore || true
          fi
          if ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            rm -f debug.keystore
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Ensure app/libs/xposed-api.jar exists in case binary jars were excluded from git export
          if [ ! -s app/libs/xposed-api.jar ]; then
            mkdir -p app/libs
            printf '%s' "$XPOSED_B64" | base64 -d > app/libs/xposed-api.jar || true
          fi

          # 3. Unconditionally write valid app/google-services.json & firebase_applet_config.xml
          mkdir -p app app/src/main/res/values
          printf '%s' "$GOOGLE_SERVICES_B64" | base64 -d > app/google-services.json
          python3 -m json.tool app/google-services.json >/dev/null
          printf '%s' "$FIREBASE_CONFIG_B64" | base64 -d > app/src/main/res/values/firebase_applet_config.xml

          # 4. Ensure .env exists for secrets-gradle-plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
            fi
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostDevice-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: GhostDevice Debug APK v1.0.${{ github.run_number }}
          body: Automatic Debug APK build for GhostDevice (PhantomCore). Download the APK below to install on your phone.
          draft: false
          prerelease: false
          make_latest: true
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
